<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>履歴管理</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <ul>
            {% if 'view_chat' in current_user.permissions %}
                <li><a href="{{ url_for('chat.index') }}">チャット</a></li>
            {% endif %}
            {% if 'view_history' in current_user.permissions %}
                <li><a href="{{ url_for('history.index') }}">履歴管理</a></li>
            {% endif %}
            {% if 'edit_history' in current_user.permissions %}
                <li><a href="{{ url_for('history.edit') }}">履歴編集</a></li>
            {% endif %}
        </ul>
    </nav>

    <div class="container">
        <h1>履歴管理</h1>
        <!-- 履歴内容を表示する領域 -->
    </div>
</body>
</html>
