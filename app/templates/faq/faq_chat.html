{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 bg-light sidebar py-4">
            {% include 'layout/sidebar.html' %}
        </div>

        <div class="col-md-10">
            {% include 'layout/navbar.html' %}

            <div id="chat-history" class="chat-container border rounded p-4 shadow-sm" style="height:70vh; overflow-y:auto;">
                {% if messages %}
                    {% for msg in messages %}
                        <div class="d-flex {% if msg.role == 'user' %}justify-content-end{% else %}justify-content-start{% endif %}">
                            <div class="alert {% if msg.role == 'user' %}alert-primary{% else %}alert-secondary{% endif %}" style="max-width:70%;">
                                {{ msg.content }}
                            </div>
                        </div>
                    {% endfor %}
                {% else %}
                    <div id="no-message" class="text-muted">メッセージはまだありません。</div>
                {% endif %}
            </div>

            <div class="input-group mt-3">
                <input type="text" id="user-input" class="form-control" placeholder="質問を入力してください...">
                <button class="btn btn-primary" id="send-btn">送信</button>
                <button class="btn btn-outline-danger" id="reset-btn">リセット</button>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/chat_faq.js') }}"></script>
{% endblock %}
