{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 bg-light sidebar py-4">
            {% include 'layout/sidebar.html' %}
        </div>

        <!-- Main User List Area -->
        <div class="col-md-10">
        <!-- Navbar -->
            {% include 'layout/navbar.html' %}

            <!-- ユーザー一覧の内容 -->
            <div class="user-list-container border rounded p-4 shadow-sm" style="height:75vh; overflow-y:auto;">
                <h1>ユーザー一覧</h1>
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>ユーザー名</th>
                            <th>メールアドレス</th>
                            <th>ロール</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                    {% for user in users %}
                        <tr>
                            <td>{{ user.id }}</td>
                            <td>{{ user.username }}</td>
                            <td>{{ user.email }}</td>
                            <td>{{ user.role }}</td>
                            <td><a href="{{ url_for('admin.edit_user', user_id=user.id) }}">編集</a></td>
                        </tr>
                    {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
