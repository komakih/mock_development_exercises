<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>チャット画面</title>
</head>
<body>
    <h2>{{ current_user.username }} さん、チャットを始めましょう！</h2>
    <div id="chat_area">
        {% if response %}
            <p><strong>あなたの質問：</strong> {{ question }}</p>
            <p><strong>AIの回答：</strong> {{ response }}</p>
        {% endif %}
    </div>

    <form method="post">
        <input type="text" name="question" placeholder="質問を入力" size="60" required>
        <input type="submit" value="送信">
    </form>

    <br>
    <a href="{{ url_for('logout') }}">ログアウト</a>
</body>
</html>
