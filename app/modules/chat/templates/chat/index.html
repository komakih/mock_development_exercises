<!-- app/modules/chat/templates/chat/index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ChatGPTチャット画面</title>
</head>
<body>
    <h1>ChatGPTチャット</h1>
    <form method="POST">
        <input type="text" name="user_input">
        <input type="submit" value="送信">
    </form>
    <form action="{{ url_for('chat.reset_chat') }}" method="post">
        <button type="submit">新しいチャットを開始</button>
    </form>
    <div>
        {% for message in messages %}
            <p><strong>{{ message.role }} ({{ message.source }}):</strong> {{ message.content }}</p>
        {% endfor %}
    </div>
</body>
</html>
