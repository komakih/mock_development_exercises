{% extends "base.html" %}
{% set page_title = "ユーザー一覧" %}
{% block content %}
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 bg-light sidebar py-4">
            {% include 'layout/sidebar.html' %}
        </div>

        <!-- Main User List Area -->
        <div class="col-md-10">
        <!-- Navbar -->
            {% include 'layout/navbar.html' %}

            <!-- ユーザー一覧の内容 -->
            <div class="user-list-container border rounded p-4 shadow-sm" style="height:75vh; overflow-y:auto;">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>ユーザー名</th>
                            <th>メールアドレス</th>
                            <th>ロール</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                    {% for user in users %}
                        <tr>
                            <td>{{ user.id }}</td>
                            <td>{{ user.username }}</td>
                            <td>{{ user.email }}</td>
                            <td>{{ user.role }}</td>
                            <td>
                                <a href="{{ url_for('admin.edit_user', user_id=user.id) }}">編集</a>
                                <!-- 削除ボタン追加 -->
                                <form method="POST" action="{{ url_for('admin.delete_user', user_id=user.id) }}" style="display:inline;">
                                    <button type="submit" class="btn btn-danger btn-sm" {% if not current_user.has_permission('delete_user') %}disabled{% endif %}>
                                        削除
                                    </button>
                                </form>
                            </td>
                        </tr>
                    {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
