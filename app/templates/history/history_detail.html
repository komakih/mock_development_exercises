{% extends "base.html" %}
{% set page_title = "チャット履歴詳細" %}
{% block content %}
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-2 bg-light sidebar py-4">
      {% include 'layout/sidebar.html' %}
    </div>

    <!-- Main History Detail Area -->
    <div class="col-md-10">
      <!-- Navbar -->
      {% include 'layout/navbar.html' %}

      <!-- 履歴詳細の内容 -->
        <div class="history-detail-container border rounded p-4 shadow-sm" style="height:75vh; overflow-y:auto;">
            <div class="container mt-5">
                <div class="card">
                    <div class="card-body">
                        <p><strong>日時:</strong> {{ history.created_at }}</p>
                        <p><strong>ユーザーのメッセージ:</strong> {{ history.user_message }}</p>
                        <p><strong>アシスタントの回答:</strong> {{ history.assistant_message }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
