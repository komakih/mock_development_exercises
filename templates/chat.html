<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>チャット画面</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <h2>{{ current_user.username }} さん、チャットを始めましょう！</h2>

    <div id="chat_area">
        {% if messages %}
            {% for msg in messages %}
                <p><strong>あなた：</strong> {{ msg.user_message }}</p>
                <p><strong>AI：</strong> {{ msg.assistant_message }}</p>
                <hr>
            {% endfor %}
        {% elif response %}
            <p><strong>あなた：</strong> {{ question }}</p>
            <p><strong>AI：</strong> {{ response }}</p>
        {% endif %}
    </div>

    <form id="chatForm">
        <input type="hidden" id="thread_id" value="{{ thread_id or '' }}">
        <input type="text" id="message" placeholder="質問を入力" size="60" required>
        <input type="submit" value="送信">
    </form>

    <br>
    <a href="{{ url_for('history') }}">履歴一覧へ</a> | 
    <a href="{{ url_for('logout') }}">ログアウト</a>

    <script>
    document.getElementById('chatForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const messageInput = document.getElementById('message');
        const message = messageInput.value;
        const thread_id = document.getElementById('thread_id').value || '';

        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message, thread_id})
        });

        const data = await response.json();
        document.getElementById('thread_id').value = data.thread_id;

        const chatArea = document.getElementById('chat_area');
        chatArea.innerHTML += `<p><strong>あなた：</strong> ${message}</p>`;
        chatArea.innerHTML += `<p><strong>AI：</strong> ${data.assistant_message}</p><hr>`;

        messageInput.value = '';
    });
    </script>
</body>
</html>
