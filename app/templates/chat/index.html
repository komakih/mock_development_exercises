{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-2 bg-light sidebar py-4">
      {% include 'layout/sidebar.html' %}
    </div>

    <!-- Main Chat Area -->
    <div class="col-md-10">
      <!-- Navbar -->
      {% include 'layout/navbar.html' %}

      <!-- Chat Messages -->
      <div class="chat-container border rounded p-4 shadow-sm" style="height:75vh; overflow-y:auto;">
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-secondary">{{ msg }}</div>
            {% endfor %}
        {% else %}
            <div class="text-muted">メッセージはまだありません。</div>
        {% endif %}
</div>

      <!-- Chat Input -->
      <form method="POST" action="{{ url_for('chat.index') }}" class="mt-3">
        <div class="input-group">
          <input type="text" class="form-control" name="user_input" placeholder="質問を入力してください...">
          <button class="btn btn-primary" type="submit">送信</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
