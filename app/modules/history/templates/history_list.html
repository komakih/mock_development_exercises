<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>チャット履歴一覧</title>
</head>
<body>
    <h2>チャット履歴一覧</h2>
    <ul>
        {% for history in histories %}
            <li>
                <a href="{{ url_for('history.history_detail', history_id=history.id) }}">
                    {{ history.created_at }} - {{ history.user_message }}
                </a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
