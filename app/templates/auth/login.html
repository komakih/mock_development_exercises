{% extends "base.html" %}

{% block content %}
    <h2>ログイン</h2>
    <form method="POST">
        {{ form.hidden_tag() }}
        <p>{{ form.email.label }}<br>{{ form.email(size=32) }}</p>
        <p>{{ form.password.label }}<br>{{ form.password(size=32) }}</p>
        <p>{{ form.submit() }}</p>
    </form>

    <div class="mt-3">
        <p>ユーザー登録がお済みでない方は、
            <a href="{{ url_for('auth.register') }}">こちらからご登録ください</a>。
        </p>
    </div>

{% endblock %}
