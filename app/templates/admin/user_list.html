{% extends "base.html" %}

{% block content %}
    <h1>ユーザー一覧</h1>
    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>ユーザー名</th>
                <th>メールアドレス</th>
                <th>ロール</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
        {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.username }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.role }}</td>
                <td><a href="{{ url_for('admin.edit_user', user_id=user.id) }}">編集</a></td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% endblock %}
