<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>FAQ連携チャット</title>
    <h2>FAQ連携チャット機能</h2>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_faq.css') }}">
</head>
<body>
    <div id="chat-area"></div>
    <input type="text" id="user-input" placeholder="質問を入力してください">
    <button onclick="sendMessage()">送信</button>

    <script>
        async function sendMessage() {
            const input = document.getElementById("user-input").value;
            const responseArea = document.getElementById("chat-area");

            const res = await fetch("/faq/faq-help", {  // この行を修正
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: input })
            });

            const data = await res.json();
            const message = data.suggestions && data.suggestions[0] ? data.suggestions[0].answer : "関連する情報が見つかりませんでした。";

            responseArea.innerHTML += `
                <div class="bot">
                    ${message}
                </div>
            `;
        }

    </script>
</body>
</html>
